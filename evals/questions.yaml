# The eval set. Every answer is graded by code, never by another model.
#
# answerable: true   -> the answer is in the corpus. `gold` lists the article(s) that hold it
#                       (any one counts as a retrieval hit or a correct citation). `expect` is a
#                       list of regular expressions that must ALL match the normalised answer
#                       (lower case, thousands separators removed: "EUR 100 000" -> "eur 100000").
#                       `reject` patterns must NOT match. `pass`/`fail` are hand-written answers
#                       the grader must accept and reject (tests/test_grading.py checks this), and
#                       tests/test_questions.py checks every `expect` pattern also matches the gold
#                       article's own text, so no expected fact is missing from the documents.
# answerable: false  -> the corpus does not hold the answer; the only correct reply is the refusal
#                       sentence. `absent` patterns are checked to appear nowhere in the corpus.
#
# kind: fact | false_premise (the question asserts something the source contradicts)
#       | out_of_corpus (banking question the three acts don't answer) | injection

# --- PSD2: Directive (EU) 2015/2366 on payment services ---------------------------------

- id: psd2-notification-deadline
  kind: fact
  answerable: true
  question: How long after the debit date can a payment service user still notify their bank of an unauthorised payment transaction and obtain rectification?
  gold: [PSD2-71]
  expect: ['\b(13|thirteen) months\b']
  pass: The user must notify the provider without undue delay, and no later than 13 months after the debit date [1].
  fail: The user has 8 weeks from the debit date to notify the provider [1].

- id: psd2-unauthorised-refund
  kind: fact
  answerable: true
  question: By when must a payer's payment service provider refund an unauthorised payment transaction?
  gold: [PSD2-73]
  expect: ['(following|next) business day']
  pass: Immediately, and in any event no later than by the end of the following business day after noting or being notified of the transaction [2].
  fail: Within 10 business days of the payer's request [2].

- id: psd2-liability-cap
  kind: fact
  answerable: true
  question: What is the maximum loss a payer can be made to bear for unauthorised transactions resulting from a lost or stolen payment instrument?
  gold: [PSD2-74]
  expect: ['\b50\b']
  pass: The payer may be obliged to bear losses up to a maximum of EUR 50 [1].
  fail: The payer may have to bear losses up to EUR 150 [1].

- id: psd2-no-sca-liability
  kind: fact
  answerable: true
  question: If the payer's bank did not require strong customer authentication, does the payer have to bear losses from an unauthorised transaction?
  gold: [PSD2-74]
  expect: ['\b(no|not|none)\b', 'fraud']
  reject: ['^yes\b']
  pass: No. The payer shall not bear any financial losses unless the payer has acted fraudulently [3].
  fail: Yes, the payer bears losses up to EUR 50 [3].

- id: psd2-direct-debit-refund-window
  kind: fact
  answerable: true
  question: For how long after the funds were debited can a payer request a refund of an authorised direct debit?
  gold: [PSD2-77, PSD2-76]
  expect: ['\b(8|eight) weeks\b']
  pass: The payer can request a refund for a period of 8 weeks from the date on which the funds were debited [1].
  fail: The payer can request a refund for 13 months after the debit date [1].

- id: psd2-refund-request-reply
  kind: fact
  answerable: true
  question: Within how many business days must a payment service provider act on a request to refund a direct debit?
  gold: [PSD2-77]
  expect: ['\b(10|ten) business days\b']
  pass: Within 10 business days of receiving the request, the provider must either refund the full amount or justify its refusal [2].
  fail: Within 15 business days of receiving the request [2].

- id: psd2-execution-time
  kind: fact
  answerable: true
  question: What is the maximum execution time for a payment transaction to a payment account, counted from the time the payment order is received?
  gold: [PSD2-83]
  expect: ['(following|next) business day']
  pass: The amount must be credited to the payee's provider's account by the end of the following business day [1].
  fail: The amount must be credited within three business days [1].

- id: psd2-paper-extension
  kind: fact
  answerable: true
  question: By how much can the execution time limit be extended for paper-initiated payment transactions?
  gold: [PSD2-83]
  expect: ['(further|additional|extra|one|1) business day']
  pass: The time limit may be extended by a further business day for paper-initiated payment transactions [1].
  fail: It may be extended by five business days [1].

- id: psd2-sca-situations
  kind: fact
  answerable: true
  question: In which situations must a payment service provider apply strong customer authentication?
  gold: [PSD2-97]
  expect: ['online', 'initiat', 'remote']
  pass: When the payer accesses its payment account online, initiates an electronic payment transaction, or carries out any action through a remote channel which may imply a risk of payment fraud or other abuses [1].
  fail: Only for card payments above EUR 50 [1].

- id: psd2-complaint-reply
  kind: fact
  answerable: true
  question: What is the deadline for a payment service provider to reply to a customer's complaint?
  gold: [PSD2-101]
  expect: ['\b(15|fifteen) business days\b']
  pass: The reply must come within an adequate timeframe and at the latest within 15 business days of receipt of the complaint [4].
  fail: The reply must come within one month of receipt of the complaint [4].

- id: psd2-complaint-exceptional
  kind: fact
  answerable: true
  question: In exceptional situations, what is the longest a payment service provider may take to give its final reply to a complaint?
  gold: [PSD2-101]
  expect: ['\b(35|thirty-five) business days\b']
  pass: The final reply must be received no later than 35 business days after receipt of the complaint [2].
  fail: The final reply must be received within 15 business days [2].

- id: psd2-sca-elements
  kind: fact
  answerable: true
  question: Which categories of elements does strong customer authentication combine?
  gold: [PSD2-4]
  expect: ['knowledge', 'possession', 'inherence']
  pass: Two or more elements categorised as knowledge, possession and inherence, which are independent of each other [1].
  fail: A password and a one-time code sent by email [1].

- id: psd2-termination-notice
  kind: fact
  answerable: true
  question: What is the longest notice period a payment service user can be required to give to terminate a framework contract?
  gold: [PSD2-55]
  expect: ['\b(1|one) month\b']
  pass: If a notice period is agreed, it may not exceed 1 month [1].
  fail: The notice period may not exceed 2 months [1].

- id: psd2-termination-charges
  kind: fact
  answerable: true
  question: When may a payment service provider charge a customer for terminating a framework contract?
  gold: [PSD2-55]
  expect: ['\b(6|six) months\b']
  pass: Termination is free of charge except where the contract has been in force for less than 6 months [1].
  fail: Termination is always free of charge for the customer [1].

- id: psd2-contract-changes
  kind: fact
  answerable: true
  question: How far in advance must a payment service provider propose changes to the conditions of a framework contract?
  gold: [PSD2-54]
  expect: ['\b(2|two) months\b']
  pass: No later than 2 months before their proposed date of application [3].
  fail: No later than 30 days before the changes apply [3].

- id: psd2-card-amount-unknown
  kind: fact
  answerable: true
  question: Under what condition may a bank block funds on a payer's account for a card payment whose exact amount is not known in advance?
  gold: [PSD2-75]
  expect: ['consent', 'exact amount']
  pass: Only if the payer has given consent to the exact amount of the funds to be blocked [1].
  fail: The bank may block any amount it considers reasonable [1].

- id: psd2-direct-debit-revocation
  kind: fact
  answerable: true
  question: Until when can a payer revoke a direct debit payment order?
  gold: [PSD2-80]
  expect: ['business day (preceding|before)|(preceding|before) the day agreed']
  pass: At the latest by the end of the business day preceding the day agreed for debiting the funds [2].
  fail: Until the funds have been credited to the payee [2].

# --- DGSD: Directive 2014/49/EU on deposit guarantee schemes ------------------------------

- id: dgsd-coverage-level
  kind: fact
  answerable: true
  question: What is the coverage level for each depositor's aggregate deposits under the Deposit Guarantee Schemes Directive?
  gold: [DGSD-6]
  expect: ['\b100000\b']
  pass: The coverage level for the aggregate deposits of each depositor is EUR 100 000 [1].
  fail: The coverage level is EUR 50 000 per account [1].

- id: dgsd-temporary-high-balance
  kind: fact
  answerable: true
  question: For how long are deposits from private residential real estate transactions protected above the standard coverage level?
  gold: [DGSD-6]
  expect: ['\b(3|three) months\b', '\b(12|twelve) months\b']
  pass: For at least three months and no longer than 12 months after the amount has been credited [1].
  fail: For up to six months after the sale [1].

- id: dgsd-repayment-deadline
  kind: fact
  answerable: true
  question: Within how many working days must a deposit guarantee scheme make the repayable amount available?
  gold: [DGSD-8]
  expect: ['\b(7|seven) working days\b']
  pass: Within seven working days of the date of the determination [2].
  fail: Within 20 working days [2].

- id: dgsd-aggregate-accounts
  kind: fact
  answerable: true
  question: If a depositor has a savings account and a current account at the same credit institution, does the coverage limit apply to each account separately?
  gold: [DGSD-7]
  expect: ['aggregate|combined|together|in total|all (of )?(the |their |your )?deposits']
  reject: ['^yes\b']
  pass: No. The limit applies to the aggregate deposits placed with the same credit institution, irrespective of the number of deposits [1].
  fail: Yes, each account is covered up to EUR 100 000 [1].

- id: dgsd-target-level
  kind: fact
  answerable: true
  question: What target level of available financial means must a deposit guarantee scheme reach?
  gold: [DGSD-10]
  expect: ['0[.,]8 ?%']
  pass: At least 0,8 % of the amount of the covered deposits of its members [1].
  fail: At least 1 % of the covered deposits [1].

- id: dgsd-information-sheet
  kind: fact
  answerable: true
  question: How often must the depositor information sheet be provided to depositors?
  gold: [DGSD-16]
  expect: ['annual|once a year|every year|each year']
  pass: The information sheet must be provided to the depositor at least annually [3].
  fail: Only when the account is opened [3].

# --- GDPR: Regulation (EU) 2016/679 ------------------------------------------------------

- id: gdpr-breach-notification
  kind: fact
  answerable: true
  question: How quickly must a controller notify the supervisory authority of a personal data breach?
  gold: [GDPR-33]
  expect: ['\b72 hours\b']
  pass: Without undue delay and, where feasible, not later than 72 hours after having become aware of it [1].
  fail: Within 24 hours of becoming aware of the breach [1].

- id: gdpr-request-deadline
  kind: fact
  answerable: true
  question: How long does a controller have to respond to a data subject's request to exercise their rights?
  gold: [GDPR-12]
  expect: ['\b(1|one) month\b']
  pass: Without undue delay and in any event within one month of receipt of the request [2].
  fail: Within 72 hours of receipt of the request [2].

- id: gdpr-request-extension
  kind: fact
  answerable: true
  question: By how much can a controller extend the deadline for answering a data subject's request?
  gold: [GDPR-12]
  expect: ['\b(2|two) (further |additional |more )?months\b']
  pass: The period may be extended by two further months where necessary [1].
  fail: The period may be extended by 30 days [1].

- id: gdpr-maximum-fine
  kind: fact
  answerable: true
  question: What is the highest administrative fine an undertaking can face under the GDPR?
  gold: [GDPR-83]
  expect: ['20000000|20 million', '\b4 ?%']
  pass: Up to EUR 20 000 000 or, for an undertaking, up to 4 % of total worldwide annual turnover, whichever is higher [1].
  fail: Up to EUR 10 000 000 or 2 % of turnover [1].

- id: gdpr-child-consent-age
  kind: fact
  answerable: true
  question: From what age can a child consent on their own to the processing of personal data for information society services?
  gold: [GDPR-8]
  expect: ['\b16\b']
  pass: Processing is lawful where the child is at least 16 years old [1].
  fail: From the age of 18 [1].

- id: gdpr-portability-format
  kind: fact
  answerable: true
  question: In what format does a data subject have the right to receive their data under the right to data portability?
  gold: [GDPR-20]
  expect: ['machine-readable']
  pass: In a structured, commonly used and machine-readable format [1].
  fail: As a printed copy sent by post [1].

- id: gdpr-breach-data-subject
  kind: fact
  answerable: true
  question: When must a controller communicate a personal data breach to the data subjects affected?
  gold: [GDPR-34]
  expect: ['high risk']
  pass: When the breach is likely to result in a high risk to the rights and freedoms of natural persons, without undue delay [2].
  fail: Only when the supervisory authority orders it [2].

# --- False premises: the question asserts something the source contradicts ----------------

- id: premise-liability-150
  kind: false_premise
  answerable: true
  question: PSD2 caps the payer's liability for a lost or stolen card at EUR 150. How much of a EUR 400 fraudulent payment would the payer have to bear?
  gold: [PSD2-74]
  expect: ['\b50\b']
  pass: The cap is EUR 50, not EUR 150, so the payer would bear at most EUR 50 [1].
  fail: The payer would bear EUR 150 of the EUR 400 [1].

- id: premise-coverage-50000
  kind: false_premise
  answerable: true
  question: Since deposits are only protected up to EUR 50 000 per depositor, how much of a EUR 80 000 balance is covered?
  gold: [DGSD-6]
  expect: ['\b100000\b']
  pass: The coverage level is EUR 100 000, not EUR 50 000, so the whole EUR 80 000 is covered [1].
  fail: EUR 50 000 of the balance is covered [1].

- id: premise-breach-24h
  kind: false_premise
  answerable: true
  question: The GDPR requires breach notification to the supervisory authority within 24 hours, correct?
  gold: [GDPR-33]
  expect: ['\b72 hours\b']
  pass: Not quite. The controller must notify without undue delay and, where feasible, not later than 72 hours after becoming aware of it [1].
  fail: Yes, notification is required within 24 hours [1].

